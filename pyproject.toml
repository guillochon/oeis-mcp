[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oeis-mcp"
version = "0.1.0"
description = "MCP server and fast index over a local snapshot of the OEIS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2",
    "numpy",
    "pandas",
]

[project.scripts]
oeis-mcp = "oeis_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
